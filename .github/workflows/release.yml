name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: npm-release
  queue: max

jobs:
  prepare:
    if: github.repository == 'ecomfe/dls-icons'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      artifact: ${{ steps.packages.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Detect a version bump
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: node build/release.mjs plan "$BEFORE" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.plan.outputs.version != ''
      - name: Build and pack npm packages
        if: steps.plan.outputs.version != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format --check
          pnpm build
          mkdir -p "$RUNNER_TEMP/npm-packages"
          pnpm --filter './packages/dls-icons-*' pack --pack-destination "$RUNNER_TEMP/npm-packages"
      - uses: actions/upload-artifact@v7
        id: packages
        if: steps.plan.outputs.version != ''
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/npm-packages
      - name: Publish to npm using OIDC
        run: node build/release.mjs publish "$RELEASE_VERSION" "$RUNNER_TEMP/npm-packages"
      - name: Update the changelog and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node build/release.mjs finalize "$RELEASE_VERSION"
